# Grafana alert rules (file provisioning; JSON is valid YAML). Rules whose metrics
# don't exist at a site (no backup profile, no SMART disk) stay quiet: noData = OK.
{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "homelab",
      "folder": "Homelab",
      "interval": "1m",
      "rules": [
        {
          "uid": "disk-full",
          "title": "Disk almost full",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: {{ $labels.mountpoint }} is {{ humanizePercentage $values.A.Value }} full"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host, mountpoint) (1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs\"})",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.85
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "memory-high",
          "title": "Memory pressure",
          "condition": "C",
          "for": "15m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: memory {{ humanizePercentage $values.A.Value }} used"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host) (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.9
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "temp-high",
          "title": "SoC running hot",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: {{ $values.A.Value }}\u00b0C"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host) (node_thermal_zone_temp)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        75
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "target-down",
          "title": "Metrics target down",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: {{ $labels.job }} is not responding to scrapes"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "min by (host, job) (up)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "deploy-failing",
          "title": "Deploy failing",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: homelab-sync is failing; see journalctl -u homelab-sync"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "min by (host) (homelab_deploy_success)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "backup-stale",
          "title": "Backup overdue",
          "condition": "C",
          "for": "1h",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: last successful backup was {{ $values.A.Value | printf \"%.0f\" }}h ago"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host) (time() - homelab_backup_last_success_timestamp_seconds) / 3600",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        36
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "cert-expiring",
          "title": "Certificate expiring",
          "condition": "C",
          "for": "1h",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: certificate {{ $labels.cn }} expires in {{ $values.A.Value | printf \"%.0f\" }} days; ACME renewal is failing"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "min by (host, cn) (traefik_tls_certs_not_after - time()) / 86400",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        14
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "wan-down",
          "title": "Internet down",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: no internet probe has succeeded (this alert can only arrive once it's back)"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host) (probe_success{job=\"wan\"})",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "disk-wearing",
          "title": "Disk wearing out",
          "condition": "C",
          "for": "1h",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: {{ $labels.device }} has used {{ $values.A.Value }}% of its rated endurance"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host, device) (smartctl_device_percentage_used)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        80
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "disk-unhealthy",
          "title": "Disk SMART failure",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: {{ $labels.device }} reports a failing SMART status"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "min by (host, device) (smartctl_device_smart_status)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "os-upgrade-failed",
          "title": "OS auto-update failed",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: unattended-upgrades failed; see journalctl -u apt-daily-upgrade"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host) (homelab_os_upgrade_failed)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "reboot-pending",
          "title": "Reboot pending",
          "condition": "C",
          "for": "48h",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: updates have been waiting on a reboot for 2 days (is OS_AUTO_REBOOT off?)"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host) (homelab_os_reboot_required)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "disk-writes-high",
          "title": "Disk write rate high",
          "condition": "C",
          "for": "1h",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: {{ $labels.device }} is averaging {{ $values.A.Value | printf \"%.1f\" }} GB/day of writes (SD cards wear out; see README \u2192 SD-card hosts)"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 21600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "instant": true,
                "expr": "max by (host, device) (rate(node_disk_written_bytes_total{device=~\"mmcblk[0-9]+|nvme[0-9]+n[0-9]+|sd[a-z]+\"}[6h])) * 86400 / 1e9"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        2
                      ]
                    }
                  }
                ]
              }
            }
          ]
        }
      ]
    }
  ]
}
