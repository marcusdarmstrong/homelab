# Grafana alert rules (file provisioning; JSON is valid YAML). Rules whose metrics
# don't exist (no service with backups yet, no SMART disk) stay quiet: noData = OK.
{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "homelab",
      "folder": "Homelab",
      "interval": "1m",
      "rules": [
        {
          "uid": "disk-full",
          "title": "Disk almost full",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: {{ $labels.mountpoint }} is {{ humanizePercentage $values.A.Value }} full"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host, mountpoint) (1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs\"})",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.85
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "memory-high",
          "title": "Memory pressure",
          "condition": "C",
          "for": "15m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: memory {{ humanizePercentage $values.A.Value }} used"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host) (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.9
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "temp-high",
          "title": "SoC running hot",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: {{ $values.A.Value }}\u00b0C"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host) (node_thermal_zone_temp)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        75
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "target-down",
          "title": "Metrics target down",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: {{ $labels.job }} is not responding to scrapes"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "min by (host, job) (up)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "deploy-failing",
          "title": "Deploy failing",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: homelab-sync is failing; see journalctl -u homelab-sync"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "min by (host) (homelab_deploy_success)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "backup-stale",
          "title": "Backup overdue",
          "condition": "C",
          "for": "1h",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.service }}: last successful backup was {{ $values.A.Value | printf \"%.0f\" }}h ago"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "min by (service) (time() - homelab_backup_last_success_timestamp_seconds) / 3600",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        36
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "backup-never",
          "title": "Backup never succeeded",
          "condition": "C",
          "for": "1h",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.service }}: backups are failing and none has ever succeeded"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (service) (homelab_backup_last_failure_timestamp_seconds) unless max by (service) (homelab_backup_last_success_timestamp_seconds)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "host-down",
          "title": "Host down",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.host }} has stopped sending metrics: down, offline, or off the tailnet"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "group by (host) (max_over_time(up{job=\"node\"}[1d])) unless group by (host) (up{job=\"node\"})",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "cert-expiring",
          "title": "Certificate expiring",
          "condition": "C",
          "for": "1h",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: certificate {{ $labels.cn }} expires in {{ $values.A.Value | printf \"%.0f\" }} days; ACME renewal is failing"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "min by (host, cn) (traefik_tls_certs_not_after - time()) / 86400",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        14
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "wan-down",
          "title": "Internet down",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: no internet probe has succeeded (this alert can only arrive once it's back)"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host) (probe_success{job=\"wan\"})",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "disk-wearing",
          "title": "Disk wearing out",
          "condition": "C",
          "for": "1h",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: {{ $labels.device }} has used {{ $values.A.Value }}% of its rated endurance"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host, device) (smartctl_device_percentage_used)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        80
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "disk-unhealthy",
          "title": "Disk SMART failure",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: {{ $labels.device }} reports a failing SMART status"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "min by (host, device) (smartctl_device_smart_status)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "os-upgrade-failed",
          "title": "OS auto-update failed",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: unattended-upgrades failed; see journalctl -u apt-daily-upgrade"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host) (homelab_os_upgrade_failed)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "reboot-pending",
          "title": "Reboot pending",
          "condition": "C",
          "for": "48h",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: updates or settings have been waiting on a reboot for 2 days (is OS_AUTO_REBOOT off, or did a reboot not help? see journalctl -u homelab-sync)"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max by (host) (homelab_os_reboot_required)",
                "instant": true
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "sd-writes-fast",
          "title": "SD card wearing fast",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: {{ $labels.device }} is writing {{ $values.A.Value | printf \"%.0f\" }} GB/day, several times its 2 GB/day budget; the dashboard's Disk section shows which container (see README \u2192 SD-card hosts)"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 21600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "instant": true,
                "expr": "(max by (host, device) (rate(node_disk_written_bytes_total{device=~\"mmcblk[0-9]+\"}[1h])) * 86400 / 1e9 > 28.8 and max by (host, device) (rate(node_disk_written_bytes_total{device=~\"mmcblk[0-9]+\"}[5m])) * 86400 / 1e9 > 28.8) or (max by (host, device) (rate(node_disk_written_bytes_total{device=~\"mmcblk[0-9]+\"}[6h])) * 86400 / 1e9 > 12 and max by (host, device) (rate(node_disk_written_bytes_total{device=~\"mmcblk[0-9]+\"}[30m])) * 86400 / 1e9 > 12)"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "disk-writes-high",
          "title": "SD card write budget",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.host }}: {{ $labels.device }} has averaged {{ $values.A.Value | printf \"%.1f\" }} GB/day of writes for 3 days, over its 2 GB/day budget; SD cards wear out (see README \u2192 SD-card hosts)"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 259200,
                "to": 0
              },
              "model": {
                "refId": "A",
                "instant": true,
                "expr": "max by (host, device) (rate(node_disk_written_bytes_total{device=~\"mmcblk[0-9]+\"}[3d])) * 86400 / 1e9 > 2 and max by (host, device) (rate(node_disk_written_bytes_total{device=~\"mmcblk[0-9]+\"}[6h])) * 86400 / 1e9 > 2"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "ingest-errors-fast",
          "title": "Pushes rejected",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "{{ $labels.service }} is rejecting {{ humanizePercentage $values.A.Value }} of what the hosts push; the sending host's Alloy logs the reason (journalctl | grep non-recoverable)"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 21600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "instant": true,
                "expr": "label_replace((sum by (service) (rate(traefik_service_requests_total{service=~\"(prometheus|loki)@docker\", method=\"POST\", code!~\"2..\"}[1h])) / sum by (service) (rate(traefik_service_requests_total{service=~\"(prometheus|loki)@docker\", method=\"POST\"}[1h])) > 0.144 and sum by (service) (rate(traefik_service_requests_total{service=~\"(prometheus|loki)@docker\", method=\"POST\", code!~\"2..\"}[5m])) / sum by (service) (rate(traefik_service_requests_total{service=~\"(prometheus|loki)@docker\", method=\"POST\"}[5m])) > 0.144) or (sum by (service) (rate(traefik_service_requests_total{service=~\"(prometheus|loki)@docker\", method=\"POST\", code!~\"2..\"}[6h])) / sum by (service) (rate(traefik_service_requests_total{service=~\"(prometheus|loki)@docker\", method=\"POST\"}[6h])) > 0.06 and sum by (service) (rate(traefik_service_requests_total{service=~\"(prometheus|loki)@docker\", method=\"POST\", code!~\"2..\"}[30m])) / sum by (service) (rate(traefik_service_requests_total{service=~\"(prometheus|loki)@docker\", method=\"POST\"}[30m])) > 0.06), \"service\", \"$1\", \"service\", \"(.+)@docker\")"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "ingest-errors-budget",
          "title": "Push error budget",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "{{ $labels.service }} has rejected {{ humanizePercentage $values.A.Value }} of what the hosts pushed over 3 days, over its 1% budget; the sending host's Alloy logs the reason (journalctl | grep non-recoverable)"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 259200,
                "to": 0
              },
              "model": {
                "refId": "A",
                "instant": true,
                "expr": "label_replace(sum by (service) (rate(traefik_service_requests_total{service=~\"(prometheus|loki)@docker\", method=\"POST\", code!~\"2..\"}[3d])) / sum by (service) (rate(traefik_service_requests_total{service=~\"(prometheus|loki)@docker\", method=\"POST\"}[3d])) > 0.01 and sum by (service) (rate(traefik_service_requests_total{service=~\"(prometheus|loki)@docker\", method=\"POST\", code!~\"2..\"}[6h])) / sum by (service) (rate(traefik_service_requests_total{service=~\"(prometheus|loki)@docker\", method=\"POST\"}[6h])) > 0.01, \"service\", \"$1\", \"service\", \"(.+)@docker\")"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "undervoltage",
          "title": "Undervoltage",
