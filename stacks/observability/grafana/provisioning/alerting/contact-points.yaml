# All alerts go to this site's ntfy server, using ntfy's built-in Grafana
# message template.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy
        type: webhook
        settings:
          url: http://ntfy/homelab-alerts?template=grafana
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: ${NTFY_GRAFANA_TOKEN}

policies:
  - orgId: 1
    receiver: ntfy
    group_by: [grafana_folder, alertname, host]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
