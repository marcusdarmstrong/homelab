# Any dashboard JSON committed to stacks/observability/grafana/dashboards/
# is loaded on startup. To keep a dashboard built in the UI, export its JSON
# and commit it here.

apiVersion: 1

providers:
  - name: homelab
    folder: Homelab
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
