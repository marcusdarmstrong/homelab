# Any dashboard JSON committed to stacks/observability/grafana/dashboards/
# is loaded on startup. To keep a dashboard built in the UI, export its JSON
# and commit it here.

apiVersion: 1

providers:
  - name: homelab
    folder: Homelab
    type: file
    disableDeletion: true
    allowUiUpdates: false
    # Deploys recreate Grafana when a dashboard file changes, so polling is
    # only a fallback; each poll writes to the database.
    updateIntervalSeconds: 3600
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
