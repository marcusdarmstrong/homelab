# Central observability. Profile: observability, on exactly one host.
#
# Every host's Alloy (stacks/alloy) pushes metrics and logs over the tailnet
# to prometheus.HOMELAB_DOMAIN and loki.HOMELAB_DOMAIN. Grafana sits on top
# (Pocket ID login) and sends alerts to ntfy, which phones reach from the
# internet (see ntfy below). Metrics and logs are history: when the profile
# moves to another host, they start over there.
#
# Services with config files here carry `homelab.config-hash` (set by
# scripts/apply.sh) so that editing a config file recreates them.

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    profiles: [observability]
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
      - --web.enable-remote-write-receiver
      - --web.external-url=https://prometheus.${BASE_DOMAIN}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    labels:
      - traefik.enable=true
      # The UI, under this host's name behind SSO.
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${BASE_DOMAIN}`)
      - traefik.http.routers.prometheus.middlewares=sso@docker
      - traefik.http.routers.prometheus.service=prometheus
      # Remote write from every host's Alloy, at the fixed name.
      - traefik.http.routers.prometheus-write.rule=Host(`prometheus.${HOMELAB_DOMAIN:?}`) && Path(`/api/v1/write`)
      - traefik.http.routers.prometheus-write.middlewares=tailnet@docker
      - traefik.http.routers.prometheus-write.service=prometheus
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
      - homelab.metrics.port=9090
      - homelab.config-hash=${CONFIG_HASH_OBSERVABILITY_PROMETHEUS:-}

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    profiles: [observability]
    security_opt:
      - no-new-privileges:true
    command:
      - -config.file=/etc/loki/loki.yaml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-30d}
      LOKI_WAL_ENABLED: ${LOKI_WAL_ENABLED:-true}
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    labels:
      # Pushes from every host's Alloy, at the fixed name.
      - traefik.enable=true
      - traefik.http.routers.loki-push.rule=Host(`loki.${HOMELAB_DOMAIN:?}`) && Path(`/loki/api/v1/push`)
      - traefik.http.routers.loki-push.middlewares=tailnet@docker
      - traefik.http.services.loki.loadbalancer.server.port=3100
      - homelab.metrics.port=3100
      - homelab.config-hash=${CONFIG_HASH_OBSERVABILITY_LOKI:-}

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    profiles: [observability]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${HOMELAB_DOMAIN:?}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # SQLite WAL mode: far fewer page and journal rewrites per write.
      GF_DATABASE_WAL: "true"
      # Alert state is saved on this interval rather than after every
      # evaluation, which rewrites a row per rule; config/sdcard.env sets 5m.
      GF_FEATURE_TOGGLES_ENABLE: alertingSaveStatePeriodic
      GF_UNIFIED_ALERTING_STATE_PERIODIC_SAVE_INTERVAL: ${GRAFANA_ALERT_STATE_SAVE_INTERVAL:-1m}
      # Pocket ID is the only way in: no login form, no basic auth, no
      # built-in admin password to manage.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Pocket ID
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile groups
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://id.${HOMELAB_DOMAIN:?}/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://id.${HOMELAB_DOMAIN:?}/api/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://id.${HOMELAB_DOMAIN:?}/api/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
      # Read by provisioning/alerting/contact-points.yaml.
      NTFY_GRAFANA_TOKEN: ${NTFY_GRAFANA_TOKEN:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${HOMELAB_DOMAIN:?}`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - homelab.metrics.port=3000
      - homelab.config-hash=${CONFIG_HASH_OBSERVABILITY_GRAFANA:-}

  # Push notifications for Grafana alerts. Phones subscribe to the
  # `homelab-alerts` topic at https://ntfy.HOMELAB_DOMAIN as user `phone`,
  # from anywhere: the name points at this site's public address
  # (ntfy-records), and the site's gateway forwards 443 to Traefik's public
  # entrypoint, which serves only ntfy. Nothing is readable without logging
  # in; only Grafana's token may publish.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    restart: unless-stopped
    profiles: [observability]
    security_opt:
      - no-new-privileges:true
    command: serve
    environment:
      TZ: ${TZ:-UTC}
      NTFY_BASE_URL: https://ntfy.${HOMELAB_DOMAIN:?}
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_AUTH_USERS: grafana:${NTFY_GRAFANA_PASSWORD_HASH:-}:user,phone:${NTFY_PHONE_PASSWORD_HASH:-}:user
      NTFY_AUTH_ACCESS: grafana:homelab-alerts:write-only,phone:homelab-alerts:read-only
      NTFY_AUTH_TOKENS: grafana:${NTFY_GRAFANA_TOKEN:-}:grafana
      # iOS can only be woken through Apple's push service. ntfy.sh relays a
      # content-free poll request; the message itself stays on this server.
      NTFY_UPSTREAM_BASE_URL: ${NTFY_UPSTREAM_BASE_URL:-https://ntfy.sh}
      NTFY_ENABLE_METRICS: "true"
    volumes:
      - ntfy-data:/var/lib/ntfy
    labels:
      - traefik.enable=true
      - traefik.http.routers.ntfy.rule=Host(`ntfy.${HOMELAB_DOMAIN:?}`)
      - traefik.http.routers.ntfy.service=ntfy
      - traefik.http.routers.ntfy-public.rule=Host(`ntfy.${HOMELAB_DOMAIN:?}`)
      - traefik.http.routers.ntfy-public.entrypoints=public
      - traefik.http.routers.ntfy-public.service=ntfy
      - traefik.http.services.ntfy.loadbalancer.server.port=80
      - homelab.metrics.port=80

  # Points grafana, prometheus and loki at this host's tailnet address. Also
  # pings HEALTHCHECKS_URL every five minutes, so an outside service notices
  # when this host, and with it all alerting, goes quiet.
  observability-records:
    extends:
      file: ../traefik/compose.yaml
      service: dns-records
    profiles: [observability]
    environment:
      IP4_DOMAINS: grafana.${HOMELAB_DOMAIN:?},prometheus.${HOMELAB_DOMAIN:?},loki.${HOMELAB_DOMAIN:?}
      HEALTHCHECKS: ${HEALTHCHECKS_URL:-}

  # Points ntfy at this site's public address, for phones away from home.
  ntfy-records:
    extends:
      file: ../traefik/compose.yaml
      service: dns-records
    profiles: [observability]
    environment:
      IP4_DOMAINS: ntfy.${HOMELAB_DOMAIN:?}
      IP4_PROVIDER: cloudflare.trace

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  ntfy-data:
