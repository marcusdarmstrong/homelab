# Site observability. Profile: observability
#
# Alloy collects host, container and service metrics plus Docker and journald
# logs on this host and pushes them to the local Prometheus and Loki. Grafana
# sits on top (Pocket ID login) and sends alerts to ntfy. Nothing leaves the
# site except ntfy's iOS wake-up relay (see NTFY_UPSTREAM_BASE_URL).
#
# Services with config files here carry `homelab.config-hash` (set by
# scripts/apply.sh) so that editing a config file recreates them.
#
# Any container on the project network can opt in to metrics scraping with
# labels:
#   homelab.metrics.port=<port>
#   homelab.metrics.path=/metrics   (optional)

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    profiles: [observability]
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
      - --web.enable-remote-write-receiver
      - --web.external-url=https://prometheus.${BASE_DOMAIN}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${BASE_DOMAIN}`)
      - traefik.http.routers.prometheus.middlewares=sso@docker
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
      - homelab.metrics.port=9090
      - homelab.config-hash=${CONFIG_HASH_OBSERVABILITY_PROMETHEUS:-}

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    profiles: [observability]
    security_opt:
      - no-new-privileges:true
    command:
      - -config.file=/etc/loki/loki.yaml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-30d}
      LOKI_WAL_ENABLED: ${LOKI_WAL_ENABLED:-true}
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    labels:
      - homelab.metrics.port=3100
      - homelab.config-hash=${CONFIG_HASH_OBSERVABILITY_LOKI:-}

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    profiles: [observability]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${BASE_DOMAIN}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # SQLite WAL mode: far fewer page and journal rewrites per write.
      GF_DATABASE_WAL: "true"
      # Alert state is saved on this interval rather than after every
      # evaluation, which rewrites a row per rule; config/sdcard.env sets 5m.
      GF_FEATURE_TOGGLES_ENABLE: alertingSaveStatePeriodic
      GF_UNIFIED_ALERTING_STATE_PERIODIC_SAVE_INTERVAL: ${GRAFANA_ALERT_STATE_SAVE_INTERVAL:-1m}
      # Pocket ID is the only way in: no login form, no basic auth, no
      # built-in admin password to manage.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Pocket ID
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile groups
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://id.${SSO_DOMAIN:-${BASE_DOMAIN}}/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://id.${SSO_DOMAIN:-${BASE_DOMAIN}}/api/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://id.${SSO_DOMAIN:-${BASE_DOMAIN}}/api/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
      # Read by provisioning/alerting/contact-points.yaml.
      NTFY_GRAFANA_TOKEN: ${NTFY_GRAFANA_TOKEN:-}
    # Exchanges codes with Pocket ID server-side (see SSO_IP).
    extra_hosts:
      - id.${SSO_DOMAIN:-${BASE_DOMAIN}}:${SSO_IP:-host-gateway}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${BASE_DOMAIN}`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - homelab.metrics.port=3000
      - homelab.config-hash=${CONFIG_HASH_OBSERVABILITY_GRAFANA:-}

  alloy:
    image: grafana/alloy:v1.20.0
    restart: unless-stopped
    profiles: [observability]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # Host-level collection (process, cgroup and disk stats; ICMP probes)
    # needs to see the real host.
    privileged: true
    pid: host
    environment:
      HOST_NAME: ${HOST_NAME:?}
      SITE: ${SITE:?}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    # Alloy's data is a write-ahead buffer for metrics on their way to
    # Prometheus plus log read positions; neither needs to survive a reboot,
    # and on disk the buffer rewrites every sample.
    tmpfs:
      - /var/lib/alloy/data:size=256m
    networks:
      - default
      - docker-api
    labels:
      - traefik.enable=true
      - traefik.http.routers.alloy.rule=Host(`alloy.${BASE_DOMAIN}`)
      - traefik.http.routers.alloy.middlewares=sso@docker
      - traefik.http.services.alloy.loadbalancer.server.port=12345
      - homelab.config-hash=${CONFIG_HASH_OBSERVABILITY_ALLOY:-}

  # Push notifications for Grafana alerts. Phones subscribe to the
  # `homelab-alerts` topic at https://ntfy.BASE_DOMAIN (on the LAN or over
  # Tailscale). Anyone who can reach it may read; only Grafana's token may
  # publish.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    restart: unless-stopped
    profiles: [observability]
    security_opt:
      - no-new-privileges:true
    command: serve
    environment:
      TZ: ${TZ:-UTC}
      NTFY_BASE_URL: https://ntfy.${BASE_DOMAIN}
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: read-only
      NTFY_AUTH_USERS: grafana:${NTFY_GRAFANA_PASSWORD_HASH:-}:user
      NTFY_AUTH_ACCESS: grafana:homelab-alerts:write-only
      NTFY_AUTH_TOKENS: grafana:${NTFY_GRAFANA_TOKEN:-}:grafana
      # iOS can only be woken through Apple's push service. ntfy.sh relays a
      # content-free poll request; the message itself stays on this server.
      NTFY_UPSTREAM_BASE_URL: ${NTFY_UPSTREAM_BASE_URL:-https://ntfy.sh}
      NTFY_ENABLE_METRICS: "true"
    volumes:
      - ntfy-data:/var/lib/ntfy
    labels:
      - traefik.enable=true
      - traefik.http.routers.ntfy.rule=Host(`ntfy.${BASE_DOMAIN}`)
      - traefik.http.services.ntfy.loadbalancer.server.port=80
      - homelab.metrics.port=80

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  ntfy-data:
