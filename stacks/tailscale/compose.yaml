# Remote access to this site. Profile: tailscale
#
# Joins the tailnet as HOST_NAME and advertises TS_ROUTES (normally this
# site's LAN) as a subnet route, so tailnet devices can reach the site's
# services without any open ports. Approve the route in the Tailscale admin
# console (or with autoApprovers). Give each site a distinct LAN subnet so
# their routes don't collide.
#
# For *.BASE_DOMAIN to resolve remotely, add a split-DNS nameserver in the
# Tailscale admin console: BASE_DOMAIN -> this host's HOST_IP.

services:
  tailscale:
    image: tailscale/tailscale:v1.102.5
    restart: unless-stopped
    profiles: [tailscale]
    network_mode: host
    environment:
      # Only needed for first login; the node key then lives in tailscale-state.
      # An OAuth client secret (tskey-client-...) with a tag doesn't expire.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${HOST_NAME:?}
      TS_ROUTES: ${TS_ROUTES:-}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      # This host's DNS is managed by bootstrap.sh, not Tailscale.
      TS_ACCEPT_DNS: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

volumes:
  tailscale-state:
