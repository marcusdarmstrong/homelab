# Joins this host to the tailnet. Always on.
#
# The tailnet carries everything between hosts (SSO, metrics, logs) and from
# your own devices to admin pages; household traffic never touches it. Each
# host gets a stable 100.x address, published as BASE_DOMAIN by dns-records
# (stacks/traefik). No subnet routes: the sites' LANs stay separate.
#
# Joins as HOST_NAME, tagged tag:homelab (README → External setup).

services:
  tailscale:
    image: tailscale/tailscale:v1.102.5
    restart: unless-stopped
    network_mode: host
    environment:
      # An OAuth client secret (tskey-client-...) with a tag doesn't expire.
      # Only used to log in the first time; the node key then lives in
      # tailscale-state.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${HOST_NAME:?}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---advertise-tags=tag:homelab}
      TS_STATE_DIR: /var/lib/tailscale
      # Kernel networking, so the host and its containers reach 100.x
      # addresses directly.
      TS_USERSPACE: "false"
      # This host's DNS is managed by bootstrap.sh, not Tailscale.
      TS_ACCEPT_DNS: "false"
      # Don't upload connection logs to Tailscale.
      TS_NO_LOGS_NO_SUPPORT: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Healthy once the host has its 100.x address, which the dns-records
    # services wait for.
    healthcheck:
      test: ["CMD", "tailscale", "ip", "-4"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
      start_interval: 2s

volumes:
  tailscale-state:
