# Reverse proxy + automatic HTTPS. Always on.
#
# Certificates come from Let's Encrypt via the DNS-01 challenge, so nothing
# has to be reachable from the internet. One wildcard cert (*.BASE_DOMAIN) is
# issued per host and renewed automatically ~30 days before expiry.
#
# Services opt in with `traefik.enable=true` labels. A Host() rule is all a
# service needs; TLS and the cert resolver are entrypoint defaults below.
# Admin UIs add the `sso@docker` middleware (stacks/auth).

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
      - --ping=true
      - --api.dashboard=true

      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=homelab_default

      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.asDefault=true
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.http.tls.domains[0].main=${BASE_DOMAIN:?}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${BASE_DOMAIN:?}

      # Scraped by Alloy over the project network; not published.
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics

      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?}
      # Certificates aren't tagged with the CA that issued them, so staging
      # (ACME_STORAGE=acme-staging.json) keeps its own file and switching to
      # production starts clean.
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/${ACME_STORAGE:-acme.json}
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=${ACME_DNS_PROVIDER:-cloudflare}
      # Check propagation against public resolvers: Pi-hole answers for
      # BASE_DOMAIN locally and would never see the _acme-challenge TXT record.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Credentials for the DNS provider. For providers other than Cloudflare
      # see https://go-acme.github.io/lego/dns/ and add the matching variables.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
    volumes:
      - certs:/letsencrypt
    networks:
      default:
        # Containers can reach auth.BASE_DOMAIN without host or LAN DNS.
        # (Pocket ID's name comes from extra_hosts, since it may be on another
        # host.)
        aliases:
          - auth.${BASE_DOMAIN}
      docker-api:
    depends_on:
      - docker-proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.${BASE_DOMAIN}`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=sso@docker
      - homelab.metrics.port=8082

  # Read-only Docker API for Traefik, Alloy and tinyauth, so none of them
  # mount the socket itself. Lives only on the internal docker-api network.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
      EVENTS: 1
      VERSION: 1
      POST: 0
      # At info, HAProxy logs every API call (~44 MB/day with Alloy polling).
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

volumes:
  certs:
