# Reverse proxy, automatic HTTPS and this host's DNS records. Always on.
#
# Certificates come from Let's Encrypt via the DNS-01 challenge, so nothing
# has to be reachable from the internet. Each host gets one cert covering
# *.BASE_DOMAIN (its own pages) and *.HOMELAB_DOMAIN (services that run once,
# wherever they run), renewed automatically ~30 days before expiry.
#
# Services opt in with `traefik.enable=true` labels. A Host() rule is all a
# service needs; TLS and the cert resolver are entrypoint defaults below.
# Admin pages add the `sso@docker` middleware (stacks/auth); endpoints only
# other hosts use add `tailnet@docker`.
#
# The `public` entrypoint (8443) is for the few routers meant to be reached
# from the internet through a port forward; a router is only on it if it says
# so with `traefik.http.routers.<name>.entrypoints=public`.

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
      - --ping=true
      - --api.dashboard=true

      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=homelab_default

      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.asDefault=true
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      # *.HOMELAB_DOMAIN already covers BASE_DOMAIN itself; Let's Encrypt
      # refuses an order that lists both.
      - --entrypoints.websecure.http.tls.domains[0].main=*.${HOMELAB_DOMAIN:?}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${BASE_DOMAIN:?}
      - --entrypoints.public.address=:8443
      - --entrypoints.public.http.tls=true

      # Scraped by Alloy over the project network; not published.
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics

      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?}
      # Certificates aren't tagged with the CA that issued them, so staging
      # (ACME_STORAGE=acme-staging.json) keeps its own file and switching to
      # production starts clean.
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/${ACME_STORAGE:-acme.json}
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=${ACME_DNS_PROVIDER:-cloudflare}
      # Check propagation against public resolvers, independent of whatever
      # the host happens to use.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    environment:
      # Credentials for the DNS provider. For providers other than Cloudflare
      # see https://go-acme.github.io/lego/dns/ and add the matching variables.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
    volumes:
      - certs:/letsencrypt
    networks:
      default:
        # Containers can reach this host's tinyauth without leaving the host.
        aliases:
          - auth.${BASE_DOMAIN}
      docker-api:
    depends_on:
      - docker-proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.${BASE_DOMAIN}`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=sso@docker
      # Only the tailnet (other hosts, your devices) and this host's own
      # containers.
      - traefik.http.middlewares.tailnet.ipallowlist.sourcerange=100.64.0.0/10,fd7a:115c:a1e0::/48,${DOCKER_SUBNET:-172.30.0.0/24}
      - homelab.metrics.port=8082

  # Read-only Docker API for Traefik, Alloy and tinyauth, so none of them
  # mount the socket itself. Lives only on the internal docker-api network.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
      EVENTS: 1
      VERSION: 1
      POST: 0
      # At info, HAProxy logs every API call (~44 MB/day with Alloy polling).
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  # Keeps BASE_DOMAIN and *.BASE_DOMAIN pointing at this host's tailnet
  # address in Cloudflare, so a rebuilt Pi (new address) fixes its own
  # records. Services that run once extend this to publish their own names
  # from wherever they run.
  dns-records:
    image: favonia/cloudflare-ddns:1.17.1
    restart: unless-stopped
    # Reads the tailscale0 interface's address.
    network_mode: host
    # Until tailscale0 has its address there's nothing to publish, and the
    # next check would be 5 minutes away.
    depends_on:
      tailscale:
        condition: service_healthy
        required: false
    security_opt:
      - no-new-privileges:true
    environment:
      CLOUDFLARE_API_TOKEN: ${CF_DNS_API_TOKEN:-}
      TZ: ${TZ:-UTC}
      IP4_DOMAINS: ${BASE_DOMAIN:?},*.${BASE_DOMAIN:?}
      IP4_PROVIDER: local.iface:tailscale0
      IP6_PROVIDER: none
      # Kept when the service stops or moves; the next host to run it
      # overwrites them.
      DELETE_ON_STOP: "false"
      UPDATE_CRON: "@every 5m"

volumes:
  certs:
