# NVMe/disk SMART metrics (wear, temperature, health). Profile: smart
# Needs the observability profile to be useful. Mostly relevant on hosts
# with an NVMe or SSD; SD cards don't report SMART.
#
# Built locally: upstream publishes no arm64 image, only arm64 binaries.

services:
  smartctl-exporter:
    build: .
    image: homelab/smartctl-exporter:local
    pull_policy: build
    restart: unless-stopped
    profiles: [smart]
    # smartctl issues raw device commands.
    privileged: true
    labels:
      - homelab.metrics.port=9633
