# The whole homelab is one compose project. Every host runs the same code;
# its committed settings (hosts/<name>.env) decide what runs there:
#
#   COMPOSE_PROFILES=dns,observability
#
# Always on:      traefik, docker-proxy, dns-records, tinyauth, tailscale, alloy
# Profiles:
#   sso            Pocket ID, with its backups (exactly one host)
#   observability  Prometheus, Loki, Grafana, ntfy (exactly one host)
#   dns            Pi-hole (any number of hosts)
#   unifi          UniFi console metrics (one host per site)
#   smart          NVMe/disk SMART metrics (hosts with such a disk)

name: homelab

include:
  - stacks/traefik/compose.yaml
  - stacks/tailscale/compose.yaml
  - stacks/alloy/compose.yaml
  - stacks/auth/compose.yaml
  - stacks/pihole/compose.yaml
  - stacks/observability/compose.yaml
  - stacks/unifi/compose.yaml
  - stacks/smart/compose.yaml

networks:
  # Fixed subnet so Pocket ID and tinyauth can trust forwarded headers from
  # Traefik (and nothing outside the project).
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}
  # Only the read-only Docker API proxy and its few clients live here.
  docker-api:
    internal: true
