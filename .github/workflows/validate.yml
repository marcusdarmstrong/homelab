# Hosts deploy main within a minute of a push, so catch broken config before
# it gets there. A ruleset on main requires this check for PRs, including
# Renovate's, which auto-merge once it passes (README → External setup).
name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/validate.sh
