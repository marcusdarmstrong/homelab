# Hosts deploy main within a minute of a push, so catch broken config before
# it gets there. Protect main and require this check on PRs (including
# Renovate's).
name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/validate.sh
